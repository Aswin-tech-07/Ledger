services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: ledger
      POSTGRES_DB: ledger
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres -c wal_level=replica
               -c max_wal_senders=10
               -c shared_buffers=256MB

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes:
      - mongodata:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: ledger-api:local
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ledger:password@postgres:5432/ledger
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: ledger
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
      QUEUE_NAME: transactions
      PORT: "8080"
    ports: ["8080:8080"]

  worker:
    image: ledger-api:local
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ledger:password@postgres:5432/ledger
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: ledger
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
      QUEUE_NAME: transactions
    entrypoint: ["/worker"]

volumes:
  pgdata: {}
  mongodata: {}
